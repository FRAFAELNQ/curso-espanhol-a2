<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zona de Juegos — Español A2</title>
<style>
:root{
  --bg:#080a18;--card:#171d38;--text:#f8f9ff;--muted:#b8c0dd;
  --pink:#ff5ca8;--purple:#a56cff;--turq:#37e6d4;--yellow:#ffd34e;
  --blue:#42a5ff;--soft:#252e50;--border:#2d385e;--ok:#4be59a;--bad:#ff6b7c;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 0,#1d2b66,transparent 38%),radial-gradient(circle at 90% 0,#5a174d,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;line-height:1.55;overflow-x:hidden}
.container{max-width:900px;margin:auto;padding:22px 16px 60px;text-align:center}
header{padding:26px 20px;margin-bottom:15px;border-radius:22px;border:1px solid #48598d;background:linear-gradient(135deg,#172c6c,#49237f 52%,#741c58);box-shadow:0 18px 50px #0008}
h1{margin:0 0 10px;font-size:clamp(1.8rem,5vw,2.5rem);color:#fff}
.subtitle{color:#e3e6ff}

.back-btn{display:inline-block;padding:10px 18px;border-radius:12px;background:#10152b;border:1px solid var(--border);color:#fff;cursor:pointer;font-weight:800;margin-bottom:20px;text-decoration:none}
.back-btn:hover{border-color:var(--blue)}

/* Menu Fixo no Topo */
.menu-grid{display:none;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:30px} 
.game-btn{background:var(--card);border:2px solid var(--border);color:var(--text);padding:30px 20px;border-radius:20px;cursor:pointer;transition:transform 0.2s, border-color 0.2s, box-shadow 0.2s;text-align:center;display:block;width:100%}
.game-btn:hover{transform:translateY(-5px);border-color:var(--turq)}
.game-btn.active-btn{transform:translateY(-5px);box-shadow:0 10px 25px rgba(0,0,0,0.4)}
.game-btn.active-btn.pink{border-color:var(--pink)}
.game-btn.active-btn.purple{border-color:var(--purple)}
.game-btn.active-btn.turq{border-color:var(--turq)}
.game-btn h2{margin:0 0 10px;font-size:1.5rem;pointer-events:none}
.game-btn.pink h2{color:var(--pink)}.game-btn.purple h2{color:var(--purple)}.game-btn.turq h2{color:var(--turq)}
.game-btn p{pointer-events:none}

.game-view{display:none;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:20px;scroll-margin-top:20px}

/* Estado de Carregamento */
#loadingMsg{padding:40px;font-size:1.2rem;font-weight:800;color:var(--turq);border:1px solid var(--border);background:var(--soft);border-radius:16px;margin-top:20px}

/* Juego 1: Memoria */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:600px;margin:20px auto}
@media(max-width:500px){.mem-grid{grid-template-columns:repeat(3,1fr)}}
.mem-card{aspect-ratio:1;perspective:1000px;cursor:pointer}
.mem-inner{width:100%;height:100%;position:relative;transition:transform 0.5s;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;pointer-events:none}
.mem-card.flipped .mem-inner{-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.mem-front, .mem-back{width:100%;height:100%;position:absolute;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:800;padding:5px;font-size:1.1rem;word-break:break-word}
.mem-front{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.mem-back{background:var(--soft);border:2px solid var(--turq);color:var(--turq);-webkit-transform:rotateY(180deg);transform:rotateY(180deg)}
.mem-card.matched .mem-back{background:var(--ok);color:#fff;border-color:var(--ok)}

/* Juego 2: Contrarreloj */
.reloj-word{font-size:2.5rem;font-weight:900;color:var(--yellow);margin:20px 0}
.reloj-options{display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:500px;margin:auto}
.reloj-btn{padding:15px;border-radius:12px;background:var(--soft);border:1px solid var(--border);color:var(--text);font-size:1.2rem;font-weight:800;cursor:pointer}
.reloj-btn:hover{background:var(--blue);color:#fff}
.timer-container{width:100%;height:15px;background:var(--soft);border-radius:10px;margin:20px 0;overflow:hidden}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--yellow),var(--bad));transition:width 0.1s linear}

/* Juego 3: Lluvia */
.lluvia-area{position:relative;width:100%;height:400px;background:#050711;border:2px solid var(--border);border-radius:15px;overflow:hidden;margin-bottom:20px}
.falling-word{position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:1.8rem;font-weight:900;color:var(--pink);padding:10px 20px;background:var(--card);border:2px solid var(--pink);border-radius:99px;white-space:nowrap}
.lluvia-options{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

.score-board{font-size:1.2rem;font-weight:800;color:var(--turq);margin-bottom:15px}
.btn-start{background:var(--turq);color:#000;padding:12px 24px;border:none;border-radius:12px;font-size:1.2rem;font-weight:900;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>🎮 Zona de Juegos</h1>
  <div class="subtitle">Aprende y memoriza verbos jugando</div>
</header>
<div style="text-align:center;"><a href="index.html" class="back-btn">🏠 Volver al inicio</a></div>

<div id="loadingMsg">⏳ Conectando con flashcards-verbos-a2.html para leer tus verbos...</div>

<!-- MENU PRINCIPAL FIXO -->
<div class="menu-grid" id="menuGrid">
  <button id="btnMemoria" class="game-btn pink" onclick="abrirJuego('memoriaView', 'btnMemoria')">
    <h2>🃏 Parejas de Memoria</h2>
    <p class="muted">Encuentra el verbo en español y su traducción. ¡Sin prisa!</p>
  </button>
  <button id="btnReloj" class="game-btn purple" onclick="abrirJuego('relojView', 'btnReloj')">
    <h2>⏳ Contrarreloj</h2>
    <p class="muted">10 s. para elegir la traducción correcta. ¿Cuántas aciertas?</p>
  </button>
  <button id="btnLluvia" class="game-btn turq" onclick="abrirJuego('lluviaView', 'btnLluvia')">
    <h2>🌧️ Lluvia de Verbos</h2>
    <p class="muted">¡Que no caigan al suelo! Haz clic en la traducción antes del impacto.</p>
  </button>
</div>

<!-- JUEGO 1 -->
<div id="memoriaView" class="game-view">
  <h2 class="pink">🃏 Parejas de Memoria</h2>
  <div class="score-board">Parejas encontradas: <span id="memScore">0</span> / 6</div>
  <div class="mem-grid" id="memGrid"></div>
  <button class="btn-start" onclick="iniciarMemoria()">Jugar otra vez</button>
</div>

<!-- JUEGO 2 -->
<div id="relojView" class="game-view">
  <h2 class="purple">⏳ Contrarreloj</h2>
  <div class="score-board">Puntos: <span id="relojScore">0</span></div>
  <div class="timer-container"><div class="timer-bar" id="relojTimer"></div></div>
  <div class="reloj-word" id="relojWord">¿Preparado?</div>
  <div class="reloj-options" id="relojOptions">
    <button class="btn-start" style="grid-column: span 2;" onclick="siguienteReloj()">Empezar</button>
  </div>
</div>

<!-- JUEGO 3 -->
<div id="lluviaView" class="game-view">
  <h2 class="turq">🌧️ Lluvia de Verbos</h2>
  <div class="score-board">Puntos: <span id="lluviaScore">0</span> | Vidas: <span id="lluviaVidas">❤️❤️❤️</span></div>
  <div class="lluvia-area" id="lluviaArea">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">
      <button class="btn-start" onclick="siguienteLluvia()">Empezar lluvia</button>
    </div>
  </div>
  <div class="lluvia-options" id="lluviaOptions"></div>
</div>
</div>

<script>
let db = []; 

// Extração de Verbos
async function extrairVerbosDoMestre() {
  try {
    const response = await fetch('flashcards-verbos-a2.html');
    if (!response.ok) throw new Error('Ficheiro não encontrado');
    const htmlText = await response.text();

    const regex = /{\s*(?:esp|es|espanol)\s*:\s*["']([^"']+)["']\s*,\s*(?:pt|portugues)\s*:\s*["']([^"']+)["']/g;
    let match;
    
    while ((match = regex.exec(htmlText)) !== null) {
      if (!db.some(v => v.esp === match[1])) {
        db.push({ esp: match[1], pt: match[2] });
      }
    }

    if (db.length < 6) {
      db = [
        {esp:"caer", pt:"cair"}, {esp:"empezar", pt:"começar"}, {esp:"jugar", pt:"jogar"},
        {esp:"conocer", pt:"conhecer"}, {esp:"ganar", pt:"ganhar"}, {esp:"actuar", pt:"atuar"},
        {esp:"publicar", pt:"publicar"}, {esp:"vivir", pt:"viver"}
      ];
    }
  } catch (error) {
    db = [
      {esp:"caer", pt:"cair"}, {esp:"empezar", pt:"começar"}, {esp:"jugar", pt:"jogar"},
      {esp:"conocer", pt:"conhecer"}, {esp:"ganar", pt:"ganhar"}, {esp:"actuar", pt:"atuar"}
    ];
  } finally {
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('menuGrid').style.display = 'grid'; // O Menu Fica Visível Sempre!
  }
}

window.addEventListener('load', extrairVerbosDoMestre);

// ---------------- Navegação Nova ----------------
function abrirJuego(id, btnId) {
  // 1. Esconde todos os jogos e tira o destaque dos botões
  document.querySelectorAll('.game-view').forEach(v => v.style.display = 'none');
  document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active-btn'));
  
  // 2. Destaca o botão selecionado no menu e mostra o jogo
  document.getElementById(btnId).classList.add('active-btn');
  const activeView = document.getElementById(id);
  activeView.style.display = 'block';
  activeView.scrollIntoView({ behavior: 'smooth', block: 'start' });
  
  // 3. Reinicia os dados do jogo escolhido
  if(id === 'memoriaView') iniciarMemoria();
  if(id === 'relojView') {
    relojScore = 0; document.getElementById('relojScore').textContent = "0";
    document.getElementById('relojWord').textContent = "¿Preparado?";
    document.getElementById('relojOptions').innerHTML = `<button class="btn-start" style="grid-column: span 2;" onclick="siguienteReloj()">Empezar</button>`;
    document.getElementById('relojTimer').style.width = "100%";
    clearInterval(relojInterval);
  }
  if(id === 'lluviaView') {
    lluviaScore = 0; vidas = 3; 
    document.getElementById('lluviaScore').textContent = "0";
    document.getElementById('lluviaVidas').textContent = "❤️❤️❤️";
    document.getElementById('lluviaArea').innerHTML = `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"><button class="btn-start" onclick="siguienteLluvia()">Empezar lluvia</button></div>`;
    document.getElementById('lluviaOptions').innerHTML = '';
    cancelAnimationFrame(lluviaFrame);
  }
}

// ---------------- Utilitários ----------------
function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function say(txt){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'es-ES'; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

// ---------------- Jogo 1: Memoria ----------------
let memFlipped = [], memMatches = 0;

function iniciarMemoria() {
  memMatches = 0; document.getElementById('memScore').textContent = "0";
  
  let selected = shuffle([...db]).slice(0, 6);
  let cards = [];
  selected.forEach(v => {
    cards.push({ text: v.esp, type: 'esp', id: v.esp });
    cards.push({ text: v.pt, type: 'pt', id: v.esp });
  });
  cards = shuffle(cards);

  const grid = document.getElementById('memGrid');
  grid.innerHTML = '';
  cards.forEach((c) => {
    const el = document.createElement('div');
    el.className = 'mem-card';
    el.dataset.id = c.id; 
    el.innerHTML = `<div class="mem-inner"><div class="mem-front">?</div><div class="mem-back">${c.text}</div></div>`;
    el.onclick = () => flipCard(el);
    grid.appendChild(el);
  });
  memFlipped = [];
}

function flipCard(card) {
  if(memFlipped.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');
  memFlipped.push(card);
  
  say(card.dataset.id); // Pronuncia sempre a palavra em espanhol (o ID invisível)

  if(memFlipped.length === 2) setTimeout(checkMatch, 800);
}

function checkMatch() {
  const [c1, c2] = memFlipped;
  if(c1.dataset.id === c2.dataset.id) {
    c1.classList.add('matched'); c2.classList.add('matched');
    memMatches++; document.getElementById('memScore').textContent = memMatches;
    if(memMatches === 6) setTimeout(() => alert("🎉 ¡Excelente memoria!"), 500);
  } else {
    c1.classList.remove('flipped'); c2.classList.remove('flipped');
  }
  memFlipped = [];
}

// ---------------- Jogo 2: Contrarreloj ----------------
let relojScore = 0, relojInterval, timeLeft = 100;

function siguienteReloj() {
  clearInterval(relojInterval);
  timeLeft = 100;
  document.getElementById('relojTimer').style.width = "100%";
  
  let options = shuffle([...db]).slice(0, 4);
  let correct = options[Math.floor(Math.random() * 4)];
  
  document.getElementById('relojWord').textContent = correct.pt;
  
  const optsDiv = document.getElementById('relojOptions');
  optsDiv.innerHTML = '';
  options.forEach(o => {
    let btn = document.createElement('button');
    btn.className = 'reloj-btn';
    btn.textContent = o.esp;
    btn.onclick = () => {
      if(o.esp === correct.esp) {
        say(o.esp);
        relojScore++; document.getElementById('relojScore').textContent = relojScore;
        document.getElementById('relojTimer').style.background = "var(--ok)";
        setTimeout(() => { document.getElementById('relojTimer').style.background = ""; siguienteReloj(); }, 300);
      } else {
        clearInterval(relojInterval);
        alert("❌ ¡Incorrecto! Puntuación final: " + relojScore);
        iniciarJuego('relojView', 'btnReloj');
      }
    };
    optsDiv.appendChild(btn);
  });

  relojInterval = setInterval(() => {
    timeLeft -= 1;
    document.getElementById('relojTimer').style.width = timeLeft + "%";
    if(timeLeft <= 0) {
      clearInterval(relojInterval);
      alert("⏳ ¡Tiempo agotado! Puntuación final: " + relojScore);
      document.getElementById('relojOptions').innerHTML = `<button class="btn-start" style="grid-column: span 2;" onclick="siguienteReloj()">Intentar de nuevo</button>`;
    }
  }, 100);
}

// ---------------- Jogo 3: Lluvia ----------------
let lluviaScore = 0, vidas = 3, lluviaFrame;
let fallY = 0, speed = 1.5, currentLluvia = null;

function updateLluviaUI() {
  document.getElementById('lluviaScore').textContent = lluviaScore;
  document.getElementById('lluviaVidas').textContent = "❤️".repeat(vidas) + "🖤".repeat(3 - vidas);
}

function siguienteLluvia() {
  cancelAnimationFrame(lluviaFrame);
  if(vidas <= 0) {
    alert("💀 ¡Juego terminado! Puntuación: " + lluviaScore);
    document.getElementById('lluviaArea').innerHTML = `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"><button class="btn-start" onclick="abrirJuego('lluviaView', 'btnLluvia')">Intentar de nuevo</button></div>`;
    return;
  }
  
  let options = shuffle([...db]).slice(0, 3);
  currentLluvia = options[Math.floor(Math.random() * 3)];
  fallY = -50;
  
  say(currentLluvia.esp);
  
  const area = document.getElementById('lluviaArea');
  area.innerHTML = `<div class="falling-word" id="fallingWord">${currentLluvia.esp}</div>`;
  
  const optsDiv = document.getElementById('lluviaOptions');
  optsDiv.innerHTML = '';
  options.forEach(o => {
    let btn = document.createElement('button');
    btn.className = 'reloj-btn';
    btn.textContent = o.pt;
    btn.onclick = () => {
      cancelAnimationFrame(lluviaFrame);
      if(o.pt === currentLluvia.pt) {
        lluviaScore++; speed += 0.2;
        updateLluviaUI();
        area.innerHTML = `<div style="color:var(--ok);font-size:3rem;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">✨</div>`;
        setTimeout(siguienteLluvia, 500);
      } else {
        vidas--; updateLluviaUI();
        area.innerHTML = `<div style="color:var(--bad);font-size:3rem;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">❌</div>`;
        setTimeout(siguienteLluvia, 1000);
      }
    };
    optsDiv.appendChild(btn);
  });

  animateLluvia();
}

function animateLluvia() {
  fallY += speed;
  const wordEl = document.getElementById('fallingWord');
  if(wordEl) wordEl.style.top = fallY + 'px';
  
  if(fallY > 400) {
    vidas--; updateLluviaUI();
    document.getElementById('lluviaArea').innerHTML = `<div style="color:var(--bad);font-size:2rem;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">¡Cayó!</div>`;
    setTimeout(siguienteLluvia, 1000);
  } else {
    lluviaFrame = requestAnimationFrame(animateLluvia);
  }
}
</script>
</body>
</html>
