# Evita que el proyecto gratuito de Supabase se pause por inactividad.
name: Supabase ping
on:
  schedule:
    - cron: '17 6 * * 1,4'   # lunes y jueves
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la función pública
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/get_birthdays_today" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
