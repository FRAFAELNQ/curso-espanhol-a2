# Evita que el proyecto gratuito de Supabase se pause por inactividad.
# Usa solo datos públicos (URL y clave publicable): no necesita "secrets".
name: Supabase ping
on:
  schedule:
    - cron: '17 6 * * 1,4'   # lunes y jueves
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la función pública
        run: |
          curl -fsS -X POST "https://mkqlsnhjwywwqklzytxa.supabase.co/rest/v1/rpc/get_birthdays_today" \
            -H "apikey: sb_publishable_GV7qpOetx0P8wW6yrbvfxw_z8gaGCqk" \
            -H "Content-Type: application/json" -d '{}'
