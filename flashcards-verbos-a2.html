<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Verbos A2</title>
<style>
  :root {
    --bg: #fef6ff;
    --card-bg: #ffffff;
    --text: #2b1a2e;
    --muted: #8a6b8f;
    --accent: #e0218a;
    --accent2: #7c3aed;
    --accent3: #00c2a8;
    --accent4: #ffb703;
    --accent-soft: #fbe3f4;
    --border: #f0d5ec;
    --pronoun: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a0f22;
      --card-bg: #2a1a35;
      --text: #f5e9fb;
      --muted: #c49fd4;
      --accent: #ff4fb0;
      --accent2: #a78bfa;
      --accent3: #2dd4bf;
      --accent4: #fbbf24;
      --accent-soft: #3d2350;
      --border: #4a2f5c;
      --pronoun: #c4b5fd;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a0f22;
    --card-bg: #2a1a35;
    --text: #f5e9fb;
    --muted: #c49fd4;
    --accent: #ff4fb0;
    --accent2: #a78bfa;
    --accent3: #2dd4bf;
    --accent4: #fbbf24;
    --accent-soft: #3d2350;
    --border: #4a2f5c;
    --pronoun: #c4b5fd;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent2) 18%, transparent) 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 45%),
      radial-gradient(circle at 50% 95%, color-mix(in srgb, var(--accent3) 15%, transparent) 0%, transparent 50%);
    color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    margin: 0;
    padding: 24px 16px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.5rem;
    margin: 8px 0 2px;
    text-align: center;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent4));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 14px;
    text-align: center;
  }
  .lang-switch {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
  }
  .lang-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .lang-btn.active {
    background: linear-gradient(135deg, var(--accent3), var(--accent2));
    color: white;
  }
  .progress {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    min-height: 260px;
    background: var(--card-bg);
    border: 2px solid transparent;
    background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border-radius: 20px;
    padding: 28px 22px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    box-shadow: 0 6px 24px color-mix(in srgb, var(--accent2) 25%, transparent);
    transition: transform 0.15s ease;
  }
  .card:active { transform: scale(0.98); }
  .meaning { color: var(--muted); font-size: 0.95rem; font-style: italic; text-align: center; }
  .card:focus-visible { outline: 3px solid var(--accent4); outline-offset: 3px; }
  .front-word {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .group-tag {
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .speak-front {
    background: var(--accent-soft);
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
  }
  .speak-all {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 6px 14px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
    margin-top: 4px;
  }
  .cell-speak {
    background: none;
    border: none;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 2px;
    opacity: 0.7;
  }
  .cell-speak:active { opacity: 1; }
  .speed-control {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .speed-control input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .speed-value {
    min-width: 40px;
    text-align: right;
    font-weight: 600;
    color: var(--accent);
  }
  .conj-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px 10px;
    width: 100%;
  }
  .conj-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .conj-cell .pronoun {
    color: var(--pronoun);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 600;
    text-align: center;
  }
  .conj-cell .form {
    font-size: 1.05rem;
    font-weight: 700;
    text-align: center;
    word-break: break-word;
  }
  .note {
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    line-height: 1.4;
  }
  .nav {
    display: flex;
    gap: 12px;
    margin-top: 22px;
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    max-width: 480px;
  }
  .tab-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 8px 18px;
    border-radius: 9px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-weight: 600;
  }
  .quiz-score {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .quiz-prompt {
    font-size: 1.05rem;
    text-align: center;
    line-height: 1.5;
  }
  .quiz-prompt b {
    color: var(--accent);
  }
  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .quiz-option {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: var(--text);
  }
  .quiz-option.correct {
    background: #d9ecd9;
    border-color: #4a9a4a;
    color: #234d23;
  }
  .quiz-option.wrong {
    background: #f2d6d6;
    border-color: #b5502e;
    color: #6e2a17;
  }
  .quiz-option[disabled] { cursor: default; }
  .quiz-explain {
    font-size: 0.82rem;
    color: var(--muted);
    text-align: center;
    margin-top: 4px;
    line-height: 1.4;
  }
  .cat-section {
    width: 100%;
    max-width: 480px;
    margin-bottom: 18px;
  }
  .cat-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .cat-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cat-chip {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .cat-chip:active {
    background: var(--accent-soft);
  }
  .sound-section {
    width: 100%;
    max-width: 480px;
    margin-bottom: 20px;
    background: var(--card-bg);
    border: 2px solid transparent;
    background-image: linear-gradient(var(--card-bg), var(--card-bg)), linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    background-origin: border-box;
    background-clip: padding-box, border-box;
    border-radius: 16px;
    padding: 16px 18px;
  }
  .sound-title {
    font-size: 1.1rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
  }
  .sound-desc {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .sound-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .sound-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .sound-chip:active { background: var(--accent-soft); }
  .sound-note {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
    margin-top: 8px;
  }
  button.navbtn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  button.navbtn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  button.navbtn.secondary {
    background: transparent;
    color: var(--accent2);
    border: 1.5px solid var(--accent2);
  }

  .home-nav {
    display: inline-block;
    margin: 10px auto 18px;
    padding: 10px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.9rem;
    color: white;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent2) 28%, transparent);
  }
  .home-nav:hover { transform: translateY(-1px); }

  .verb-sticker {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent2) 25%, transparent) 0%, color-mix(in srgb, var(--bg) 75%, transparent) 70%);
    border: 2px solid color-mix(in srgb, var(--accent3) 55%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    box-shadow: 0 8px 20px color-mix(in srgb, var(--accent2) 25%, transparent);
    margin: 4px 0 2px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: stickerFloat 2.8s ease-in-out infinite;
  }
  .card:hover .verb-sticker {
    transform: scale(1.1) rotate(4deg);
  }
  @keyframes stickerFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(2deg); }
  }


  .export-csv-btn {
    background: #10b981;
    color: #071b15;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(16,185,129,.22);
  }
  .export-csv-btn:hover { background: #059669; transform: translateY(-1px); }
  .export-csv-btn:active { transform: scale(.98); }

</style>
</head>
<body>
<a class="home-nav" href="index.html">🏠 Volver al inicio</a>


<h1 id="titleEl">Verbos A2 — por padrões</h1>
<div class="sub" id="subEl">Toque no cartão pra virar</div>

<div class="lang-switch">
  <button class="lang-btn active" id="langBR" onclick="setLang('pt')">🇧🇷 BR</button>
  <button class="lang-btn" id="langES" onclick="setLang('es')">🇪🇸 ES</button>
  <button class="lang-btn" id="langEN" onclick="setLang('en')">🇬🇧 EN</button>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabStudy" onclick="switchTab('study')"></button>
  <button class="tab-btn" id="tabQuiz" onclick="switchTab('quiz')"></button>
  <button class="tab-btn" id="tabCat" onclick="switchTab('cat')"></button>
  <button class="tab-btn" id="tabSounds" onclick="switchTab('sounds')"></button>
</div>

<div id="studyView">
  <div class="progress" id="progress"></div>

  <div class="speed-control">
    <span>🐢</span>
    <input type="range" id="speedSlider" min="0.5" max="1.1" step="0.05" value="0.8" oninput="updateSpeed(this.value)">
    <span>🐇</span>
    <span class="speed-value" id="speedValue">0.8x</span>
  </div>

  <div class="card" id="card" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();flip()}"></div>

  <div class="nav">
    <button class="navbtn secondary" id="prevBtn" onclick="go(-1)"></button>
    <button class="navbtn" id="nextBtn" onclick="go(1)"></button>
  </div>
</div>

<div id="quizView" style="display:none; width:100%; max-width:480px; flex-direction:column; align-items:center;">
  <div class="quiz-score" id="quizScore"></div>
  <div class="card" id="quizCard" style="cursor:default;"></div>
  <div class="nav">
    <button class="navbtn secondary" id="quizRestartBtn" onclick="resetQuiz()"></button>
  </div>
</div>

<div id="catView" style="display:none; width:100%; flex-direction:column; align-items:center;"></div>
<div id="catExport" style="display:none; width:100%; max-width:480px; justify-content:center; margin:0 0 18px;">
  <button class="export-csv-btn" id="exportCsvBtn" onclick="exportVerbsCSV()">📥 Baixar Excel (.csv)</button>
</div>

<div id="soundsView" style="display:none; width:100%; flex-direction:column; align-items:center;"></div>

<script>
const cols = ["yo", "tú", "él/ella", "nosotros", "vosotros", "ellos"];

// ---------- i18n ----------
let lang = 'pt';

const UI = {
  pt: {
    title: "Verbos A2 — por padrões",
    sub: "Toque no cartão pra virar",
    tabStudy: "Estudar", tabQuiz: "Testar", tabCat: "Categorias", tabSounds: "Sons",
    exportCsv: "📥 Baixar Excel (.csv)",
    hint: "toque no cartão pra ver a conjugação",
    prev: "◀ Anterior", next: "Próxima ▶", restart: "Reiniciar ↺",
    speakAll: "🔊 Ouvir as 6 formas",
    quizScore: (c,t) => `Acertos: ${c} / ${t}`,
    quizPrompt: (w,p) => `Como se conjuga <b>${w}</b> na pessoa <b>${p}</b>?`,
    quizCorrect: "Isso mesmo! ", quizWrong: "Não foi dessa vez — ",
    quizNext: "Próxima pergunta ▶", quizRestart: "↺ Reiniciar",
    notFromClass: "* fora da lista da turma, adicionado só pra praticar o som"
  },
  es: {
    title: "Verbos A2 — por patrón",
    sub: "Toca la tarjeta para darle la vuelta",
    tabStudy: "Estudiar", tabQuiz: "Practicar", tabCat: "Categorías", tabSounds: "Sonidos",
    exportCsv: "📥 Descargar Excel (.csv)",
    hint: "toca la tarjeta para ver la conjugación",
    prev: "◀ Anterior", next: "Siguiente ▶", restart: "Reiniciar ↺",
    speakAll: "🔊 Escuchar las 6 formas",
    quizScore: (c,t) => `Aciertos: ${c} / ${t}`,
    quizPrompt: (w,p) => `¿Cómo se conjuga <b>${w}</b> en la persona <b>${p}</b>?`,
    quizCorrect: "¡Eso es! ", quizWrong: "Esta vez no — ",
    quizNext: "Siguiente pregunta ▶", quizRestart: "↺ Reiniciar",
    notFromClass: "* fuera de la lista de la clase, añadido solo para practicar el sonido"
  },
  en: {
    title: "A2 Verbs — by pattern",
    sub: "Tap the card to flip it",
    tabStudy: "Study", tabQuiz: "Quiz", tabCat: "Categories", tabSounds: "Sounds",
    exportCsv: "📥 Download Excel (.csv)",
    hint: "tap the card to see the conjugation",
    prev: "◀ Previous", next: "Next ▶", restart: "Restart ↺",
    speakAll: "🔊 Hear all 6 forms",
    quizScore: (c,t) => `Score: ${c} / ${t}`,
    quizPrompt: (w,p) => `How do you conjugate <b>${w}</b> for <b>${p}</b>?`,
    quizCorrect: "That's right! ", quizWrong: "Not quite — ",
    quizNext: "Next question ▶", quizRestart: "↺ Restart",
    notFromClass: "* not from the class list, added just to practice the sound"
  }
};

const GROUPS = {
  "ar":        { pt: "Regular -AR", es: "Regular -AR", en: "Regular -AR" },
  "ar-refl":   { pt: "Reflexivo regular -AR", es: "Reflexivo regular -AR", en: "Regular reflexive -AR" },
  "er":        { pt: "Regular -ER", es: "Regular -ER", en: "Regular -ER" },
  "ir":        { pt: "Regular -IR", es: "Regular -IR", en: "Regular -IR" },
  "eie":       { pt: "Diptongo e→ie", es: "Diptongo e→ie", en: "e→ie diphthong" },
  "eie-refl":  { pt: "Reflexivo e→ie", es: "Reflexivo e→ie", en: "Reflexive e→ie" },
  "eie-ir":    { pt: "e→ie (-IR especial)", es: "e→ie (-IR especial)", en: "e→ie (special -IR)" },
  "oue":       { pt: "Diptongo o→ue", es: "Diptongo o→ue", en: "o→ue diphthong" },
  "oue-refl":  { pt: "Reflexivo o→ue", es: "Reflexivo o→ue", en: "Reflexive o→ue" },
  "oue-ir":    { pt: "o→ue (-IR especial)", es: "o→ue (-IR especial)", en: "o→ue (special -IR)" },
  "uue":       { pt: "u→ue (único)", es: "u→ue (único)", en: "u→ue (unique)" },
  "ei-ir":     { pt: "e→i (-IR)", es: "e→i (-IR)", en: "e→i (-IR)" },
  "yo-irr":    { pt: "1ª pessoa irregular", es: "1ª persona irregular", en: "Irregular 1st person" },
  "mix-eie":   { pt: "Misto: yo + e→ie", es: "Mixto: yo + e→ie", en: "Mixed: yo + e→ie" },
  "mix-ei":    { pt: "Misto: yo + e→i", es: "Mixto: yo + e→i", en: "Mixed: yo + e→i" },
  "irr":       { pt: "Totalmente irregular", es: "Totalmente irregular", en: "Fully irregular" },
  "mix-y":     { pt: "Misto: yo + inserção de 'y'", es: "Mixto: yo + inserción de 'y'", en: "Mixed: yo + 'y' insertion" },
  "ei-ir-refl":{ pt: "Reflexivo e→i (-IR)", es: "Reflexivo e→i (-IR)", en: "Reflexive e→i (-IR)" },
  "yo-irr-zc": { pt: "1ª pessoa irregular (c→zc)", es: "1ª persona irregular (c→zc)", en: "Irregular 1st person (c→zc)" },
  "yo-irr-zc-refl": { pt: "1ª pessoa irregular (c→zc) + reflexivo", es: "1ª persona irregular (c→zc) + reflexivo", en: "Irregular 1st person (c→zc) + reflexive" },
  "uir":       { pt: "Verbos -uir (inserção de 'y')", es: "Verbos -uir (inserción de 'y')", en: "-uir verbs ('y' insertion)" },
  "eie-ir-refl": { pt: "Reflexivo e→ie (-IR especial)", es: "Reflexivo e→ie (-IR especial)", en: "Reflexive e→ie (special -IR)" },
  "yo-irr-refl": { pt: "1ª pessoa irregular + reflexivo", es: "1ª persona irregular + reflexivo", en: "Irregular 1st person + reflexive" },
  uar: { pt: "-UAR (acento no u)", es: "-UAR (acento en la u)", en: "-UAR (accent on the u)" }
};

const NOTES = {
  rootHabl:   { pt: "A raiz 'habl-' nunca muda.", es: "La raíz 'habl-' nunca cambia.", en: "The stem 'habl-' never changes." },
  sameHablar: { pt: "Mesmo padrão de hablar.", es: "Mismo patrón que hablar.", en: "Same pattern as hablar." },
  llFocus:    { pt: "Foco no som de LL.", es: "Atención al sonido de LL.", en: "Focus on the LL sound." },
  reflexive:  { pt: "Regular + pronome reflexivo antes do verbo.", es: "Regular + pronombre reflexivo antes del verbo.", en: "Regular + reflexive pronoun before the verb." },

function mTxt(v) {
  const m = MEAN[v.word];
  if (!m) return v.meaning || "";
  return lang === 'en' ? m.en : (v.meaning || m.pt);
}

let i = 0;
let flipped = false;
let voice = null;
let speechRate = 0.8;

function updateSpeed(val) {
  speechRate = parseFloat(val);
  document.getElementById('speedValue').textContent = speechRate.toFixed(2) + 'x';
}

function pickVoice() {
  const voices = speechSynthesis.getVoices();
  voice = voices.find(v => v.lang === 'es-ES')
       || voices.find(v => v.lang && v.lang.startsWith('es'))
       || null;
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}

function speak(text, rate) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  if (voice) u.voice = voice;
  u.rate = rate || speechRate;
  speechSynthesis.speak(u);
}

function speakAll(forms) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  forms.forEach((f) => {
    const u = new SpeechSynthesisUtterance(f);
    u.lang = 'es-ES';
    if (voice) u.voice = voice;
    u.rate = speechRate;
    speechSynthesis.speak(u);
  });
}

function render() {
  const v = verbs[i];
  const card = document.getElementById('card');
  document.getElementById('progress').textContent = (i+1) + " / " + verbs.length;
  document.getElementById('prevBtn').disabled = (i === 0);
  document.getElementById('nextBtn').textContent = (i === verbs.length - 1) ? t('restart') : t('next');

  if (!flipped) {
    card.innerHTML = `
      <div class="group-tag">${gTxt(v.groupKey)}</div>
      <div class="verb-sticker" aria-label="Figurinha do verbo">${v.sticker}</div>
       <div class="front-word">${v.word}</div>
      <div class="meaning">${mTxt(v)}</div>
      <button class="speak-front" onclick="event.stopPropagation(); speak('${v.word}')">🔊</button>
      <div class="hint">${t('hint')}</div>
    `;
  } else {
    const cells = cols.map((c, idx) => `
      <div class="conj-cell">
        <div class="pronoun">${c}</div>
        <div class="form">${v.forms[idx]}</div>
        <button class="cell-speak" onclick="event.stopPropagation(); speak('${v.forms[idx].replace(/'/g, "\\'")}')">🔊</button>
      </div>
    `).join("");
    card.innerHTML = `
      <div class="group-tag">${gTxt(v.groupKey)}</div>
      <div class="meaning">${v.word} — ${mTxt(v)}</div>
      <div class="conj-grid">${cells}</div>
      <button class="speak-all" onclick="event.stopPropagation(); speakAll(${JSON.stringify(v.forms)})">${t('speakAll')}</button>
      <div class="note">${nTxt(v.noteKey)}</div>
    `;
  }
}

function flip() {
  flipped = !flipped;
  render();
}

function go(dir) {
  if (i === verbs.length - 1 && dir === 1) {
    i = 0;
  } else {
    i = Math.max(0, Math.min(verbs.length - 1, i + dir));
  }
  flipped = false;
  render();
}


function csvEscape(value) {
  const s = String(value ?? "");
  return '"' + s.replace(/"/g, '""').replace(/\r?\n/g, " ") + '"';
}

function exportVerbsCSV() {
  const headers = [
    "Padrão", "Figurinha", "Infinitivo", "Significado",
    "Yo", "Tú", "Él/Ella", "Nosotros", "Vosotros", "Ellos",
    "Regra/Observação"
  ];

  const rows = verbs.map(v => [
    gTxt(v.groupKey),
    v.sticker || "",
    v.word,
    mTxt(v),
    ...v.forms,
    nTxt(v.noteKey)
  ]);

  const csvContent = [
    headers.map(csvEscape).join(";"),
    ...rows.map(row => row.map(csvEscape).join(";"))
  ].join("\r\n");

  const blob = new Blob(["\uFEFF", csvContent], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "verbos_espanol_A2_matriz.csv";
  link.style.display = "none";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}



// ---------- Modo Quiz ----------
let mode = 'study';
let quizCorrect = 0;
let quizTotal = 0;
let currentQuestion = null;

function switchTab(m) {
  mode = m;

  document.getElementById('tabQuiz').classList.toggle('active', m === 'quiz');
  document.getElementById('tabCat').classList.toggle('active', m === 'cat');
  document.getElementById('tabSounds').classList.toggle('active', m === 'sounds');
  document.getElementById('studyView').style.display = (m === 'study') ? 'block' : 'none';
  document.getElementById('quizView').style.display = (m === 'quiz') ? 'flex' : 'none';
  document.getElementById('catView').style.display = (m === 'cat') ? 'flex' : 'none';
  document.getElementById('soundsView').style.display = (m === 'sounds') ? 'flex' : 'none';
  document.getElementById('catExport').style.display = (m === 'cat') ? 'flex' : 'none';
  if (m === 'quiz' && !currentQuestion) nextQuestion();
  else if (m === 'quiz') renderQuiz();
  if (m === 'cat') renderCategories();
  if (m === 'sounds') renderSounds();
}

function renderSounds() {
  const html = SOUNDS.map(g => `
    <div class="sound-section">
      <div class="sound-title">${g.label[lang]}</div>
      <div class="sound-desc">${g.desc[lang]}</div>

        ${g.words.map(w => `<button class="sound-chip" onclick="speak('${w.replace(/'/g,"\\'")}')">🔊 ${w}</button>`).join("")}
      </div>
      ${g.fromClass ? "" : `<div class="sound-note">${t('notFromClass')}</div>`}
    </div>
  `).join("");

}

function goToVerb(word) {
  const idx = verbs.findIndex(v => v.word === word);
  if (idx === -1) return;
  i = idx;
  flipped = false;
  render();
  switchTab('study');
}

function renderCategories() {
  const groups = {};
  const order = [];
  verbs.forEach(v => {
    if (!groups[v.groupKey]) { groups[v.groupKey] = []; order.push(v.groupKey); }
    groups[v.groupKey].push(v.word);
  });
  const html = order.map(g => `
    <div class="cat-section">
      <div class="cat-title">${gTxt(g)} <span style="color:var(--muted); font-weight:400;">(${groups[g].length})</span></div>
      <div class="cat-chips">
        ${groups[g].map(w => `<button class="cat-chip" onclick="goToVerb('${w}')">${w}</button>`).join("")}
      </div>
    </div>
  `).join("");
  document.getElementById('catView').innerHTML = html;
}

function resetQuiz() {
  quizCorrect = 0;
  quizTotal = 0;
  nextQuestion();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

function buildDistractors(correctVerb, pronounIdx, correctForm) {
  const sameGroup = verbs.filter(v => v.groupKey === correctVerb.groupKey && v.word !== correctVerb.word)
                          .map(v => v.forms[pronounIdx]);
  const otherGroup = verbs.filter(v => v.groupKey !== correctVerb.groupKey)
                           .map(v => v.forms[pronounIdx]);
  const reflRe = /^(me|te|se|nos|os) /;
  const wantRefl = reflRe.test(correctForm);
  let pool = shuffle(sameGroup).concat(shuffle(otherGroup)).filter(f => reflRe.test(f) === wantRefl);
  const set = new Set();
  const out = [];
  for (const f of pool) {
    if (f !== correctForm && !set.has(f)) {
      set.add(f);
      out.push(f);
    }
    if (out.length === 3) break;
  }
  return out;
}

function nextQuestion() {
  const v = verbs[Math.floor(Math.random() * verbs.length)];
  const pronounIdx = Math.floor(Math.random() * cols.length);
  const correctForm = v.forms[pronounIdx];
  const distractors = buildDistractors(v, pronounIdx, correctForm);
  const options = shuffle([correctForm, ...distractors]);
  currentQuestion = { verb: v, pronounIdx, correctForm, options, answered: false };
  renderQuiz();
}

function renderQuiz() {
  document.getElementById('quizScore').textContent = t('quizScore')(quizCorrect, quizTotal);
  const q = currentQuestion;
  const card = document.getElementById('quizCard');
  const optsHtml = q.options.map(opt => `
    <button class="quiz-option" onclick="answerQuiz('${opt.replace(/'/g, "\\'")}')">${opt}</button>
  `).join("");
  card.innerHTML = `
    <div class="group-tag">${gTxt(q.verb.groupKey)}</div>
    <div class="quiz-prompt">${t('quizPrompt')(q.verb.word, cols[q.pronounIdx])}</div>
    <div class="quiz-options" id="quizOptions">${optsHtml}</div>
  `;
}

function answerQuiz(chosen) {
  const q = currentQuestion;
  if (q.answered) return;
  q.answered = true;
  quizTotal++;
  const correct = (chosen === q.correctForm);
  if (correct) quizCorrect++;

  const buttons = document.querySelectorAll('#quizOptions .quiz-option');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correctForm) b.classList.add('correct');
    else if (b.textContent === chosen) b.classList.add('wrong');
  });

  document.getElementById('quizScore').textContent = t('quizScore')(quizCorrect, quizTotal);

  const explain = document.createElement('div');
  explain.className = 'quiz-explain';
  explain.innerHTML = (correct ? t('quizCorrect') : t('quizWrong')) + nTxt(q.verb.noteKey);
  document.getElementById('quizCard').appendChild(explain);

  const nextBtn = document.createElement('button');
  nextBtn.className = 'navbtn';
  nextBtn.style.marginTop = '14px';
  nextBtn.textContent = t('quizNext');
  nextBtn.onclick = nextQuestion;
  document.getElementById('quizCard').appendChild(nextBtn);

  speak(q.correctForm);
}

}
